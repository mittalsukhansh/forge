name: Failure Detection Test

steps:
  - name: Passing Step
    image: alpine:3
    commands:
      - echo "Initial step passed"

  - name: Failing Step
    image: alpine:3
    commands:
      - echo "Simulating a failed test"
      - exit 1

  - name: Publish Artifact
    image: alpine:3
    commands:
      - echo "This step must never execute"
